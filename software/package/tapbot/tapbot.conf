# tapbot settings, read by tapbot and tmc2209ctl ("tmc2209ctl -m all init"
# applies the driver part at boot).  Command-line options of tmc2209ctl
# (-d, -a, -b) override these.
#
# Keys before the first [motorN] section apply to every motor; keys inside
# a section override them for that motor only.

# UART1 on P9_24 (TX) / P9_26 (RX), wired single-wire to the PDN_UART pin
# of BOTH drivers (one shared bus, told apart by the address).  Same shield
# as OpenSCARA.
device = /dev/ttyS1
baud = 115200

# Motor RMS run current in mA.  Start LOW: the Tevo Tarantula NEMA17 are
# about 1.5 A peak (RMS = peak / 1.41).  The arms are light.
current_ma = 500
# Standstill current as percent of run current
hold_percent = 50
microsteps = 16
# stealthchop (quiet) or spreadcycle (more torque at speed)
mode = stealthchop
invert_dir = 0

# 200 for 1.8 degree motors, 400 for 0.9 degree
steps_per_rev = 200
# Speed limit (motor rpm) and acceleration (rev/s^2) of jog and
# tmc2209ctl turn/move/run; tip lines are slowed down to keep each motor
# under rpm
rpm = 60
accel = 2

# Direct drive: the arm hub sits on the motor shaft (one arm turn per
# motor turn)
motor_teeth = 1
joint_teeth = 1

# Five-bar geometry (mm), from the Fusion model Plotter5Bar_M4.  Seen from
# above with the motors at the bottom: motor axes at (-base/2, 0) and
# (+base/2, 0), +Y away from the motors.
#   base_mm:     motor axis to motor axis
#   proximal_mm: motor axis to elbow axis (arm on the motor)
#   distal_mm:   elbow axis to tip axis
#   idler_y_mm:  the mirrored idler pivots sit at (±base/2, idler_y_mm);
#                the tip is kept where the idler arms can follow.  0: none
base_mm = 50
proximal_mm = 85
distal_mm = 125
idler_y_mm = 200

# Work area: x_min x_max y_min y_max (mm).  The tip never leaves it.
area_mm = -100 100 50 150

# Home: where the tip is at power-on (x y, mm), the bottom-left corner of
# the work area, next to the left motor.  The boot script runs
# "tapbot sethome", which takes the tip to be there; "tapbot home" brings
# it back before switching off.
home_mm = -100 50

# Tip lines: speed (mm/s) when none is given, and acceleration (mm/s^2)
# at the start and end of each move
line_speed = 30
line_accel = 300

# Motor angles (deg) from the +X axis, counter-clockwise seen from above.
# A positive "tmc2209ctl -m N turn 0.1" must turn the arm counter-
# clockwise; if it doesn't, set invert_dir = 1 in that section.
# min_angle / max_angle: the range tapbot may use.  Over the work area the
# left arm turns 76.6..241.9 and the right one -61.9..103.4 (make test);
# these leave ~15 deg around that.  Check them against the joint limits of
# the Fusion model.

[motor1]
# left motor.  MS1 = GND, MS2 = GND
address = 0
step_line = P9_16 [ehrpwm1b]
dir_line = P9_18 [spi0_d1]
min_angle = 60
max_angle = 260

[motor2]
# right motor.  MS1 = GND, MS2 = 3.3V
address = 2
# Not P9_28: it stays high even when driven low on this board
step_line = P9_12
dir_line = P9_30 [spi1_d1]
min_angle = -80
max_angle = 120
